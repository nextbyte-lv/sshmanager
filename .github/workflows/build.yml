name: Build Windows release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app (portable exe + MSI + NSIS installer)
        run: npm run tauri build

      - name: Stage release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item src-tauri/target/release/sshmanager.exe release-assets/SshManager-portable.exe
          Copy-Item src-tauri/target/release/bundle/msi/*.msi release-assets/
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe release-assets/

      - name: Publish latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build (main)
          make_latest: true
          body: Automated build from the latest push to main (commit ${{ github.sha }}).
          files: release-assets/*
